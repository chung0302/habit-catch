<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>习惯打卡</title>
<style>
  /* ---------- 设计变量：取值都来自 Apple 官网与 iOS 系统色 ---------- */
  :root {
    color-scheme: light;              /* 只做浅色，不跟随系统深色 */
    --bg: #ffffff;
    --text: #1d1d1f;                  /* Apple 正文黑 */
    --muted: #6e6e73;                 /* Apple 次级灰 */
    --hairline: rgba(0, 0, 0, .07);
    --glass: rgba(255, 255, 255, .62);
    --glass-strong: rgba(255, 255, 255, .78);
    --blue: #0071e3;                  /* Apple 官网蓝 */
    --blue-deep: #0060c0;
    --blue-soft: rgba(0, 113, 227, .12);
    --red: #d70015;                   /* iOS 系统红 */
    --radius: 22px;
    --ease: cubic-bezier(.32, .72, 0, 1);   /* iOS 那种起步快、收尾稳的缓动 */
    --rim: 0 0 0 1px rgba(0, 0, 0, .045);   /* 极细的玻璃外沿 */
    --highlight: inset 0 1px 0 rgba(255, 255, 255, .9);   /* 顶部高光 */
    --shadow-card: 0 1px 2px rgba(0, 0, 0, .04),
                   0 14px 34px -14px rgba(0, 0, 0, .18);
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); }

  body {
    margin: 0;
    padding: 56px 20px 80px;
    color: var(--text);
    font: 16px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif;
    letter-spacing: -.01em;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* 背景的极淡色晕：玻璃要有东西可以虚化，才看得出“液态” */
  .glow {
    position: fixed; inset: -25% -15%;
    z-index: 0; pointer-events: none;
    background:
      radial-gradient(32% 26% at 16% 14%, rgba(0, 113, 227, .14), transparent 68%),
      radial-gradient(28% 22% at 86% 6%,  rgba(255, 55, 95, .09),  transparent 68%),
      radial-gradient(34% 28% at 76% 84%, rgba(191, 90, 242, .10), transparent 70%),
      radial-gradient(30% 26% at 10% 88%, rgba(48, 176, 199, .10), transparent 70%);
    animation: drift 34s var(--ease) infinite alternate;
  }

  main { position: relative; z-index: 1; max-width: 620px; margin: 0 auto; }

  /* ---------- 顶部 ---------- */
  header { margin-bottom: 30px; }
  h1 { margin: 0; font-size: 32px; font-weight: 600; letter-spacing: -.03em; }
  .date { margin: 6px 0 0; color: var(--muted); font-size: 15px; }

  .progress { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
  .track {
    flex: 1; height: 6px; border-radius: 99px;
    background: rgba(0, 0, 0, .06);
    box-shadow: inset 0 1px 1px rgba(0, 0, 0, .04);
    overflow: hidden;
  }
  .bar {
    height: 100%; width: 0; border-radius: 99px;
    background: linear-gradient(180deg, #3395ee, var(--blue));
    transition: width .5s var(--ease);
  }
  .count { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }

  #doneBanner {
    position: relative; overflow: hidden;
    margin: 16px 0 0; padding: 12px 18px;
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .92), rgba(232, 243, 255, .78));
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    box-shadow: var(--rim), var(--highlight),
                0 12px 30px -16px rgba(0, 113, 227, .55);
    color: #0b4f9e; font-size: 15px;
    animation: rise .5s var(--ease) both;
  }
  /* 出现时划过一道光，替代原来撒粒子的庆祝 */
  #doneBanner::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(105deg, transparent 32%,
                rgba(255, 255, 255, .9) 50%, transparent 68%);
    transform: translateX(-120%);
    animation: sweep 1.3s .15s var(--ease);
  }
  #doneBanner[hidden] { display: none; }

  /* ---------- 小标题 ---------- */
  h2 { margin: 0 0 14px; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }

  /* ---------- 添加习惯 ---------- */
  form { display: flex; gap: 10px; margin: 0 0 8px; }
  input[type="text"] {
    flex: 1; min-width: 0;
    padding: 13px 18px;
    font: inherit; color: var(--text);
    background: var(--glass-strong);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border: none; border-radius: 999px;
    box-shadow: var(--rim), var(--highlight), 0 1px 2px rgba(0, 0, 0, .03);
    transition: box-shadow .22s var(--ease);
  }
  input[type="text"]::placeholder { color: #96969b; }
  input[type="text"]:focus {
    outline: none;
    box-shadow: 0 0 0 4px var(--blue-soft), var(--rim), var(--highlight);
  }
  button {
    font: inherit; color: var(--text);
    cursor: pointer; border: none; background: transparent;
  }
  .add {
    flex: none; padding: 13px 22px; border-radius: 999px;
    background: var(--blue); color: #fff; font-weight: 500;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .06),
                0 10px 22px -10px rgba(0, 113, 227, .8);
    transition: transform .2s var(--ease), background .2s var(--ease);
  }
  .add:hover { background: var(--blue-deep); }
  .add:active { transform: scale(.96); }
  .error {
    margin: 0 0 6px; min-height: 20px;
    font-size: 13px; letter-spacing: 0; color: var(--red);
  }

  /* ---------- 习惯卡片：整个页面只有这一种玻璃表面 ---------- */
  ul { list-style: none; margin: 12px 0 0; padding: 0; }

  .habit {
    margin-bottom: 12px; padding: 16px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    border-radius: var(--radius);
    box-shadow: var(--rim), var(--highlight), var(--shadow-card);
  }
  .habit-top { display: flex; align-items: center; gap: 14px; }

  /* 点亮按钮：玻璃圆点，点亮后变蓝并浮出一枚白色对勾 */
  .circle {
    position: relative; flex: none;
    width: 42px; height: 42px; padding: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, .72);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    backdrop-filter: blur(16px) saturate(180%);
    box-shadow: var(--rim), var(--highlight), 0 1px 2px rgba(0, 0, 0, .05);
    transition: transform .22s var(--ease), background .22s var(--ease),
                box-shadow .22s var(--ease);
  }
  .circle::before {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 6px; height: 11px; margin: -8px 0 0 -3px;
    border: solid #fff; border-width: 0 2px 2px 0;
    border-radius: 1px;
    transform: rotate(45deg) scale(.5);
    opacity: 0;
    transition: opacity .18s var(--ease), transform .3s var(--ease);
  }
  .circle[aria-pressed="true"] {
    background: linear-gradient(180deg, #3d95ee, var(--blue));
    box-shadow: 0 1px 2px rgba(0, 113, 227, .3),
                0 10px 20px -10px rgba(0, 113, 227, .7),
                inset 0 1px 0 rgba(255, 255, 255, .4);
  }
  .circle[aria-pressed="true"]::before { opacity: 1; transform: rotate(45deg) scale(1); }
  .circle:hover { transform: scale(1.04); }
  .circle:active { transform: scale(.9); }
  /* 点亮瞬间：一圈光晕扩散出去 */
  .circle.pop::after {
    content: ''; position: absolute; inset: -6px; border-radius: 50%;
    border: 2px solid var(--blue);
    animation: ring .6s var(--ease) forwards;
  }

  .info { flex: 1; min-width: 0; }
  .name { font-weight: 500; letter-spacing: -.01em; word-break: break-word; }
  .habit[data-done="true"] .name { color: var(--muted); }
  .meta { margin-top: 2px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .del {
    flex: none; width: 32px; height: 32px; padding: 0;
    border-radius: 50%;
    color: #96969b; font-size: 17px; line-height: 1;
    transition: background .2s var(--ease), color .2s var(--ease), transform .2s var(--ease);
  }
  .del:hover { background: rgba(0, 0, 0, .05); color: var(--red); }
  .del:active { transform: scale(.9); }

  /* ---------- 最近 7 天 ---------- */
  .week { display: flex; gap: 8px; margin: 14px 0 0 56px; }
  .day { flex: none; width: 28px; text-align: center; }
  .day span { display: block; font-size: 11px; color: var(--muted); }
  .dot {
    width: 100%; height: 18px; margin-top: 4px;
    border-radius: 7px;
    background: rgba(0, 0, 0, .055);
    box-shadow: inset 0 1px 1px rgba(0, 0, 0, .03);
    transition: background .3s var(--ease), box-shadow .3s var(--ease);
  }
  .day[data-on="true"] .dot {
    background: linear-gradient(180deg, #3d95ee, var(--blue));
    box-shadow: 0 1px 2px rgba(0, 113, 227, .25);
  }
  .day[data-today="true"] span { color: var(--text); font-weight: 500; }
  .day[data-today="true"] .dot { box-shadow: 0 0 0 3px rgba(0, 113, 227, .18); }

  /* ---------- 空状态 ---------- */
  .empty {
    margin: 28px 0; text-align: center;
    color: var(--muted); font-size: 14px;
  }
  .empty[hidden] { display: none; }

  /* ---------- 坏习惯：同样一张玻璃卡片，只多了两个计数条 ---------- */
  section { margin-top: 38px; }
  .counters { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .counter {
    display: flex; align-items: center; gap: 4px;
    padding: 6px 14px 6px 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .78);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    backdrop-filter: blur(16px) saturate(180%);
    box-shadow: var(--rim), var(--highlight);
    transition: background .22s var(--ease), box-shadow .22s var(--ease);
  }
  /* “控制住了”是好事，给它一点淡蓝的底色 */
  .counter.held[data-on="true"] {
    background: linear-gradient(180deg, rgba(236, 245, 255, .95), rgba(219, 237, 255, .9));
    box-shadow: var(--highlight), 0 1px 2px rgba(0, 113, 227, .12);
  }
  .step {
    width: 26px; height: 26px; padding: 0;
    border-radius: 50%;
    color: #96969b; font-size: 16px; line-height: 1;
    transition: background .2s var(--ease), color .2s var(--ease);
  }
  .step:hover { background: rgba(0, 0, 0, .05); color: var(--red); }
  .num {
    min-width: 30px; padding: 2px 6px; border-radius: 10px;
    color: var(--text); font-size: 18px; font-weight: 500;
    font-variant-numeric: tabular-nums;
    transition: transform .2s var(--ease), background .2s var(--ease);
  }
  .num:hover { background: rgba(0, 0, 0, .045); }
  .num:active { transform: scale(.92); }
  .counter.held .num { color: var(--blue); }
  .clabel { font-size: 13px; color: var(--muted); }

  /* ---------- 页脚 ---------- */
  footer {
    margin-top: 44px; padding-top: 20px;
    border-top: 1px solid var(--hairline);
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    font-size: 13px; color: var(--muted);
  }
  .reset {
    padding: 7px 13px; border-radius: 999px;
    font-size: 13px; color: var(--muted);
    transition: background .2s var(--ease), color .2s var(--ease);
  }
  .reset:hover { background: rgba(0, 0, 0, .05); color: var(--red); }

  /* ---------- 动效：克制，只用来确认动作被接收 ---------- */
  @keyframes drift {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(-2%, 2%, 0) scale(1.06); }
  }
  @keyframes ring {
    from { opacity: .45; transform: scale(.7); }
    to   { opacity: 0; transform: scale(1.4); }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes sweep {
    from { transform: translateX(-120%); }
    to   { transform: translateX(120%); }
  }
  @keyframes floatUp {
    from { opacity: .9; transform: translate(-50%, 0); }
    to   { opacity: 0; transform: translate(-50%, -18px); }
  }
  .plusone {
    position: absolute;
    font-size: 13px; font-weight: 500; color: var(--blue);
    animation: floatUp .75s var(--ease) forwards;
    pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  @media (max-width: 400px) {
    body { padding: 36px 16px 64px; }
    h1 { font-size: 27px; }
    .week { margin-left: 0; }   /* 窄屏时 7 天格子独占一行 */
  }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main>
  <header>
    <h1>习惯打卡</h1>
    <p class="date" id="dateLabel"></p>
    <div class="progress">
      <div class="track"><div class="bar" id="bar"></div></div>
      <div class="count" id="count"></div>
    </div>
    <p id="doneBanner" hidden>今天全部完成 🎉</p>
  </header>

  <h2>想坚持的</h2>
  <form id="addForm" autocomplete="off">
    <input id="nameInput" type="text" maxlength="24" placeholder="想坚持什么？比如：读书 30 分钟">
    <button class="add" type="submit">添加</button>
  </form>
  <p class="error" id="errorMsg" role="alert"></p>

  <ul id="list"></ul>
  <p class="empty" id="emptyTip">还没有习惯。在上面输入一个，比如「读书」。</p>

  <section>
    <h2>想改掉的</h2>
    <form id="badForm" autocomplete="off">
      <input id="badInput" type="text" maxlength="24" placeholder="想改掉什么？比如：睡前刷手机">
      <button class="add" type="submit">添加</button>
    </form>
    <p class="error" id="badError" role="alert"></p>
    <ul id="badList"></ul>
    <p class="empty" id="badEmpty">记录一个想改掉的坏习惯，点数字记次数。</p>
  </section>

  <footer>
    <span>数据只保存在这台电脑的浏览器里</span>
    <button class="reset" id="resetBtn" type="button">清空全部</button>
  </footer>
</main>

<script>
/* =====================================================================
   1) 数据层：整个程序的状态就是一个对象，改完调用 save() 存进 localStorage
   ===================================================================== */
const STORAGE_KEY = 'habit-tracker-v1';

// 数据结构：
// { habits: [ { id, name, done: { '2026-09-20': true } } ],
//   bad:    [ { id, name, log: { '2026-09-20': { hit: 2, held: 1 } } } ] }
let state = load();

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { habits: [], bad: [] };
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.habits)) return { habits: [], bad: [] };
    // 简单清洗：防止存进来的数据格式不对导致页面报错
    data.habits = data.habits
      .filter(h => h && typeof h.name === 'string')
      .map(h => ({
        id: h.id || newId(),
        name: h.name,
        done: (h.done && typeof h.done === 'object') ? h.done : {}
      }));
    data.bad = Array.isArray(data.bad) ? data.bad
      .filter(b => b && typeof b.name === 'string')
      .map(b => ({
        id: b.id || newId(),
        name: b.name,
        log: (b.log && typeof b.log === 'object') ? b.log : {}
      })) : [];
    return data;
  } catch (e) {
    console.warn('本地数据损坏，已重置为空白。', e);
    return { habits: [], bad: [] };
  }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function newId() {
  return Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
}

/* =====================================================================
   2) 日期工具：用“本地日期字符串”当钥匙，天然支持跨天自动重置
   ===================================================================== */
function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function addDays(d, n) {
  const c = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  c.setDate(c.getDate() + n);
  return c;
}

const WEEK_LABEL = ['日', '一', '二', '三', '四', '五', '六'];

// 连续天数：从今天往回数；今天还没点，就从昨天开始数（更宽容）
function streakOf(habit, today) {
  let cursor = today;
  if (!habit.done[dateKey(today)]) cursor = addDays(today, -1);
  let n = 0;
  while (habit.done[dateKey(cursor)]) {
    n++;
    cursor = addDays(cursor, -1);
  }
  return n;
}

/* =====================================================================
   3) 渲染层：把数据画成 DOM。每次改动整体重画，代码简单不易出错
   ===================================================================== */
const listEl = document.getElementById('list');
const emptyTipEl = document.getElementById('emptyTip');
const badListEl = document.getElementById('badList');
const badEmptyEl = document.getElementById('badEmpty');
const barEl = document.getElementById('bar');
const countEl = document.getElementById('count');
const dateLabelEl = document.getElementById('dateLabel');
const doneBannerEl = document.getElementById('doneBanner');
const errorMsgEl = document.getElementById('errorMsg');
const badErrorEl = document.getElementById('badError');

let justToggledId = null;   // 记录刚刚被点亮的习惯，用来播动画

function render() {
  const today = new Date();
  const todayStr = dateKey(today);

  dateLabelEl.textContent = `${today.getFullYear()} 年 ${today.getMonth() + 1} 月 ${today.getDate()} 日 · 星期${WEEK_LABEL[today.getDay()]}`;

  // 顶部进度
  const total = state.habits.length;
  const doneCount = state.habits.filter(h => h.done[todayStr]).length;
  barEl.style.width = total ? (doneCount / total * 100) + '%' : '0%';
  countEl.textContent = total ? `${doneCount} / ${total}` : '—';
  doneBannerEl.hidden = !(total > 0 && doneCount === total);

  emptyTipEl.hidden = total > 0;

  listEl.replaceChildren(...state.habits.map(h => habitRow(h, today)));
  badListEl.replaceChildren(...state.bad.map(b => badRow(b, todayStr)));
  badEmptyEl.hidden = state.bad.length > 0;
  justToggledId = null;   // 动画只播一次
}

// 坏习惯一行：名称 + 累计 + 今天两个计数条
function badRow(item, todayStr) {
  const rec = item.log[todayStr] || { hit: 0, held: 0 };
  const sum = totals(item);

  const li = document.createElement('li');
  li.className = 'habit';

  const top = document.createElement('div');
  top.className = 'habit-top';

  const info = document.createElement('div');
  info.className = 'info';
  const nameEl = document.createElement('div');
  nameEl.className = 'name';
  nameEl.textContent = item.name;
  const metaEl = document.createElement('div');
  metaEl.className = 'meta';
  metaEl.textContent = (sum.hit || sum.held)
    ? `累计 ${sum.hit} 次发生 · ${sum.held} 次控制住`
    : '今天还没有记录';
  info.append(nameEl, metaEl);

  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'del';
  del.textContent = '×';
  del.setAttribute('aria-label', `删除：${item.name}`);
  del.addEventListener('click', () => deleteBad(item.id));

  top.append(info, del);

  const counters = document.createElement('div');
  counters.className = 'counters';
  counters.append(
    counter(item, 'hit', '发生了', rec.hit || 0),
    counter(item, 'held', '控制住了', rec.held || 0)
  );

  li.append(top, counters);
  return li;
}

// 一个计数条：− 数字 标签。点数字 +1，点 − 减 1
function counter(item, field, label, value) {
  const wrap = document.createElement('div');
  wrap.className = 'counter ' + field;
  wrap.dataset.on = String(value > 0);

  const minus = document.createElement('button');
  minus.type = 'button';
  minus.className = 'step';
  minus.textContent = '−';
  minus.setAttribute('aria-label', `${label} 减 1`);
  minus.style.visibility = value ? 'visible' : 'hidden';   // 为 0 时留位不显示，布局不跳
  minus.addEventListener('click', () => bump(item.id, field, -1));

  const num = document.createElement('button');
  num.type = 'button';
  num.className = 'num';
  num.textContent = String(value);
  num.setAttribute('aria-label', `${item.name} ${label} 加 1，当前 ${value}`);
  num.addEventListener('click', () => bump(item.id, field, 1));

  const lab = document.createElement('span');
  lab.className = 'clabel';
  lab.textContent = label;

  wrap.append(minus, num, lab);
  return wrap;
}

// 累计次数：把每天的记录加起来
function totals(item) {
  const sum = { hit: 0, held: 0 };
  Object.values(item.log).forEach(r => {
    sum.hit += r.hit || 0;
    sum.held += r.held || 0;
  });
  return sum;
}

function habitRow(habit, today) {
  const todayStr = dateKey(today);
  const isDone = !!habit.done[todayStr];
  const streak = streakOf(habit, today);

  const li = document.createElement('li');
  li.className = 'habit';
  li.dataset.done = isDone ? 'true' : 'false';

  // --- 第一行：圆点开关 + 名称 + 连续天数 + 删除 ---
  const top = document.createElement('div');
  top.className = 'habit-top';

  const circle = document.createElement('button');
  circle.type = 'button';
  circle.className = 'circle' + (habit.id === justToggledId ? ' pop' : '');
  circle.setAttribute('aria-pressed', String(isDone));
  circle.setAttribute('aria-label', `今天${isDone ? '取消' : '完成'}：${habit.name}`);
  circle.addEventListener('click', () => toggleHabit(habit.id));

  const info = document.createElement('div');
  info.className = 'info';
  const nameEl = document.createElement('div');
  nameEl.className = 'name';
  nameEl.textContent = habit.name;
  const metaEl = document.createElement('div');
  metaEl.className = 'meta';
  metaEl.textContent = streak > 0 ? `连续 ${streak} 天` : '今天开始';
  info.append(nameEl, metaEl);

  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'del';
  del.textContent = '×';
  del.setAttribute('aria-label', `删除：${habit.name}`);
  del.addEventListener('click', () => deleteHabit(habit.id));

  top.append(circle, info, del);

  // --- 第二行：最近 7 天 ---
  const week = document.createElement('div');
  week.className = 'week';
  for (let i = 6; i >= 0; i--) {
    const d = addDays(today, -i);
    const cell = document.createElement('div');
    cell.className = 'day';
    cell.dataset.on = String(!!habit.done[dateKey(d)]);
    cell.dataset.today = String(i === 0);

    const label = document.createElement('span');
    label.textContent = WEEK_LABEL[d.getDay()];
    const dot = document.createElement('div');
    dot.className = 'dot';
    cell.append(label, dot);

    cell.title = `${dateKey(d)} ${habit.done[dateKey(d)] ? '已完成' : '未完成'}`;
    week.append(cell);
  }

  li.append(top, week);
  return li;
}

/* =====================================================================
   4) 行为层：用户操作 -> 改数据 -> 存盘 -> 重画
   ===================================================================== */
function toggleHabit(id) {
  const habit = state.habits.find(h => h.id === id);
  if (!habit) return;

  const todayStr = dateKey(new Date());
  const wasDone = !!habit.done[todayStr];

  if (wasDone) delete habit.done[todayStr];
  else {
    habit.done[todayStr] = true;
    justToggledId = id;
  }
  save();
  render();

  if (!wasDone) playPlusOne(id);   // 全部完成时，横幅会自己淡入并扫过一道光
}

function allDoneToday() {
  const todayStr = dateKey(new Date());
  return state.habits.length > 0 && state.habits.every(h => h.done[todayStr]);
}

function bump(id, field, delta) {
  const item = state.bad.find(b => b.id === id);
  if (!item) return;
  const key = dateKey(new Date());
  const rec = item.log[key] || (item.log[key] = { hit: 0, held: 0 });
  rec[field] = Math.max(0, (rec[field] || 0) + delta);
  if (!rec.hit && !rec.held) delete item.log[key];   // 全是 0 就不留空记录
  save();
  render();
}

function addHabit(rawName) {
  const name = rawName.trim().replace(/\s+/g, ' ');
  if (!name) return showError(errorMsgEl, '请先输入习惯名称');
  if (state.habits.some(h => h.name === name)) return showError(errorMsgEl, '这个习惯已经在列表里了');

  state.habits.push({ id: newId(), name, done: {} });
  save();
  showError(errorMsgEl, '');
  render();
}

function addBad(rawName) {
  const name = rawName.trim().replace(/\s+/g, ' ');
  if (!name) return showError(badErrorEl, '请先输入要改掉的习惯');
  if (state.bad.some(b => b.name === name)) return showError(badErrorEl, '这个已经在列表里了');

  state.bad.push({ id: newId(), name, log: {} });
  save();
  showError(badErrorEl, '');
  render();
}

function deleteHabit(id) {
  const habit = state.habits.find(h => h.id === id);
  if (!habit) return;
  if (!confirm(`删除「${habit.name}」？打卡记录也会一起删除。`)) return;
  state.habits = state.habits.filter(h => h.id !== id);
  save();
  render();
}

function deleteBad(id) {
  const item = state.bad.find(b => b.id === id);
  if (!item) return;
  if (!confirm(`删除「${item.name}」？次数记录也会一起删除。`)) return;
  state.bad = state.bad.filter(b => b.id !== id);
  save();
  render();
}

/* =====================================================================
   5) 反馈：进度条、+1 飘字、全部完成的横幅
   ===================================================================== */
function showError(el, msg) {
  el.textContent = msg;
}

function playPlusOne(id) {
  const row = [...document.querySelectorAll('.habit')][state.habits.findIndex(h => h.id === id)];
  if (!row) return;
  const tag = document.createElement('span');
  tag.className = 'plusone';
  tag.textContent = '+1';
  row.style.position = 'relative';
  tag.style.left = '37px';   // 对准圆点的圆心
  tag.style.top = '9px';
  row.append(tag);
  setTimeout(() => tag.remove(), 700);
}

/* =====================================================================
   6) 启动：绑定表单、跨天自动刷新
   ===================================================================== */
const form = document.getElementById('addForm');
const nameInput = document.getElementById('nameInput');
const badForm = document.getElementById('badForm');
const badInput = document.getElementById('badInput');

form.addEventListener('submit', (e) => {
  e.preventDefault();
  addHabit(nameInput.value);
  nameInput.value = '';
  nameInput.focus();
});

badForm.addEventListener('submit', (e) => {
  e.preventDefault();
  addBad(badInput.value);
  badInput.value = '';
  badInput.focus();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!state.habits.length) return;
  if (!confirm('清空所有习惯和打卡记录？此操作无法撤销。')) return;
  state = { habits: [], bad: [] };
  save();
  render();
});

// 页面一直开着跨过零点时，自动重画成新的一天
let lastDay = dateKey(new Date());
setInterval(() => {
  const now = dateKey(new Date());
  if (now !== lastDay) {
    lastDay = now;
    render();
  }
}, 30 * 1000);

render();
</script>
