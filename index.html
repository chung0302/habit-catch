<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>习惯打卡</title>
<style>
  /* ---------- 主题色：只在这里改颜色，全站跟着变 ---------- */
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --text: #35302b;
    --muted: #8d837a;
    --line: #ebe4db;
    --accent: #e2703a;        /* 点亮时的颜色 */
    --accent-soft: #fbe8dd;
    --danger: #b4543c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a18;
      --card: #26231f;
      --text: #eee7e0;
      --muted: #9d938a;
      --line: #37322c;
      --accent: #f0864f;
      --accent-soft: #3a2a20;
      --danger: #e08a72;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 32px 16px 64px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  main { max-width: 560px; margin: 0 auto; }

  /* ---------- 顶部 ---------- */
  header { margin-bottom: 20px; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .01em; }
  .date { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

  .progress {
    display: flex; align-items: center; gap: 12px;
    margin-top: 14px;
  }
  .track {
    flex: 1; height: 8px; border-radius: 99px;
    background: var(--line); overflow: hidden;
  }
  .bar {
    height: 100%; width: 0; border-radius: 99px;
    background: var(--accent);
    transition: width .35s ease;
  }
  .count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

  #doneBanner {
    margin: 12px 0 0; padding: 10px 14px;
    border-radius: 12px;
    background: var(--accent-soft);
    color: var(--text); font-size: 14px;
    animation: fadeUp .35s ease both;
  }
  #doneBanner[hidden] { display: none; }

  /* ---------- 小标题 ---------- */
  h2 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }

  /* ---------- 添加习惯 ---------- */
  form { display: flex; gap: 8px; margin: 0 0 6px; }
  input[type="text"] {
    flex: 1; min-width: 0;
    padding: 12px 14px;
    font: inherit; color: var(--text);
    background: var(--card);
    border: 1px solid var(--line); border-radius: 12px;
  }
  input[type="text"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font: inherit; cursor: pointer;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); color: var(--text);
  }
  .add {
    padding: 12px 18px; font-weight: 500;
    background: var(--accent); color: #fff; border-color: transparent;
  }
  .error {
    margin: 0 0 4px; min-height: 20px;
    font-size: 13px; color: var(--danger);
  }

  /* ---------- 习惯列表 ---------- */
  ul { list-style: none; margin: 8px 0 0; padding: 0; }

  .habit {
    margin-bottom: 10px; padding: 14px;
    background: var(--card);
    border: 1px solid var(--line); border-radius: 14px;
  }
  .habit-top { display: flex; align-items: center; gap: 12px; }

  /* 点亮按钮：整个圆点就是开关 */
  .circle {
    flex: none;
    width: 40px; height: 40px; padding: 0;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: transparent;
    transition: background .18s ease, border-color .18s ease, transform .12s ease;
  }
  .circle:hover { border-color: var(--accent); }
  .circle[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
  }
  /* 点亮瞬间的小反馈 */
  .circle.pop { animation: pop .4s ease; }

  .info { flex: 1; min-width: 0; }
  .name {
    font-weight: 500; word-break: break-word;
  }
  .habit[data-done="true"] .name { color: var(--muted); text-decoration: line-through; }
  .meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .del {
    flex: none;
    width: 32px; height: 32px;
    border: none; background: transparent;
    color: var(--muted); font-size: 18px; line-height: 1;
    border-radius: 8px;
  }
  .del:hover { color: var(--danger); background: var(--accent-soft); }

  /* ---------- 最近 7 天 ---------- */
  .week {
    display: flex; gap: 6px;
    margin: 12px 0 0 52px;   /* 与圆点右侧对齐 */
  }
  .day { width: 26px; text-align: center; }
  .day span { display: block; font-size: 11px; color: var(--muted); }
  .dot {
    width: 100%; height: 16px; margin-top: 3px;
    border-radius: 5px;
    background: var(--line);
  }
  .day[data-on="true"] .dot { background: var(--accent); }
  .day[data-today="true"] span { color: var(--text); font-weight: 500; }
  .day[data-today="true"] .dot { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--accent); }

  /* ---------- 空状态 / 页脚 ---------- */
  .empty {
    margin: 24px 0; text-align: center;
    color: var(--muted); font-size: 14px;
  }
  .empty[hidden] { display: none; }

  /* ---------- 坏习惯：只多了一个计数条 ---------- */
  section { margin-top: 28px; }
  .counters { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .counter {
    display: flex; align-items: center; gap: 4px;
    padding: 5px 10px 5px 6px;
    border: 1px solid var(--line); border-radius: 10px;
  }
  .counter.held[data-on="true"] { background: var(--accent-soft); border-color: transparent; }
  .step {
    width: 24px; height: 24px; padding: 0;
    border: none; background: transparent; color: var(--muted);
    font-size: 16px; line-height: 1; border-radius: 6px;
  }
  .step:hover { background: var(--accent-soft); color: var(--danger); }
  .num {
    min-width: 28px; padding: 2px 4px;
    border: none; background: transparent;
    color: var(--text); font-size: 18px; font-variant-numeric: tabular-nums;
  }
  .num:hover { background: var(--accent-soft); border-radius: 8px; }
  .counter.held .num { color: var(--accent); font-weight: 500; }
  .clabel { font-size: 13px; color: var(--muted); }

  footer {
    margin-top: 28px; padding-top: 16px;
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    font-size: 13px; color: var(--muted);
  }
  .reset { padding: 6px 10px; font-size: 13px; color: var(--muted); }
  .reset:hover { color: var(--danger); }

  /* ---------- 动画 ---------- */
  @keyframes pop {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.22); }
    100% { transform: scale(1); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes floatUp {
    from { opacity: 1; transform: translate(-50%, 0); }
    to   { opacity: 0; transform: translate(-50%, -22px); }
  }
  @keyframes fly {
    from { opacity: 1; transform: translate(0, 0) scale(1); }
    to   { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.4); }
  }
  .plusone {
    position: absolute;
    font-size: 12px; color: var(--accent);
    animation: floatUp .7s ease-out forwards;
    pointer-events: none;
  }
  .spark {
    position: fixed; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: fly .8s ease-out forwards;
    pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  @media (max-width: 380px) {
    .week { margin-left: 0; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>习惯打卡</h1>
    <p class="date" id="dateLabel"></p>
    <div class="progress">
      <div class="track"><div class="bar" id="bar"></div></div>
      <div class="count" id="count"></div>
    </div>
    <p id="doneBanner" hidden>今天全部完成 🎉</p>
  </header>

  <h2>想坚持的</h2>
  <form id="addForm" autocomplete="off">
    <input id="nameInput" type="text" maxlength="24" placeholder="想坚持什么？比如：读书 30 分钟">
    <button class="add" type="submit">添加</button>
  </form>
  <p class="error" id="errorMsg" role="alert"></p>

  <ul id="list"></ul>
  <p class="empty" id="emptyTip">还没有习惯。在上面输入一个，比如「读书」。</p>

  <section>
    <h2>想改掉的</h2>
    <form id="badForm" autocomplete="off">
      <input id="badInput" type="text" maxlength="24" placeholder="想改掉什么？比如：睡前刷手机">
      <button class="add" type="submit">添加</button>
    </form>
    <p class="error" id="badError" role="alert"></p>
    <ul id="badList"></ul>
    <p class="empty" id="badEmpty">记录一个想改掉的坏习惯，点数字记次数。</p>
  </section>

  <footer>
    <span>数据只保存在这台电脑的浏览器里</span>
    <button class="reset" id="resetBtn" type="button">清空全部</button>
  </footer>
</main>

<script>
/* =====================================================================
   1) 数据层：整个程序的状态就是一个对象，改完调用 save() 存进 localStorage
   ===================================================================== */
const STORAGE_KEY = 'habit-tracker-v1';

// 数据结构：
// { habits: [ { id, name, done: { '2026-09-20': true } } ],
//   bad:    [ { id, name, log: { '2026-09-20': { hit: 2, held: 1 } } } ] }
let state = load();

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { habits: [], bad: [] };
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.habits)) return { habits: [], bad: [] };
    // 简单清洗：防止存进来的数据格式不对导致页面报错
    data.habits = data.habits
      .filter(h => h && typeof h.name === 'string')
      .map(h => ({
        id: h.id || newId(),
        name: h.name,
        done: (h.done && typeof h.done === 'object') ? h.done : {}
      }));
    data.bad = Array.isArray(data.bad) ? data.bad
      .filter(b => b && typeof b.name === 'string')
      .map(b => ({
        id: b.id || newId(),
        name: b.name,
        log: (b.log && typeof b.log === 'object') ? b.log : {}
      })) : [];
    return data;
  } catch (e) {
    console.warn('本地数据损坏，已重置为空白。', e);
    return { habits: [], bad: [] };
  }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function newId() {
  return Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
}

/* =====================================================================
   2) 日期工具：用“本地日期字符串”当钥匙，天然支持跨天自动重置
   ===================================================================== */
function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function addDays(d, n) {
  const c = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  c.setDate(c.getDate() + n);
  return c;
}

const WEEK_LABEL = ['日', '一', '二', '三', '四', '五', '六'];

// 连续天数：从今天往回数；今天还没点，就从昨天开始数（更宽容）
function streakOf(habit, today) {
  let cursor = today;
  if (!habit.done[dateKey(today)]) cursor = addDays(today, -1);
  let n = 0;
  while (habit.done[dateKey(cursor)]) {
    n++;
    cursor = addDays(cursor, -1);
  }
  return n;
}

/* =====================================================================
   3) 渲染层：把数据画成 DOM。每次改动整体重画，代码简单不易出错
   ===================================================================== */
const listEl = document.getElementById('list');
const emptyTipEl = document.getElementById('emptyTip');
const badListEl = document.getElementById('badList');
const badEmptyEl = document.getElementById('badEmpty');
const barEl = document.getElementById('bar');
const countEl = document.getElementById('count');
const dateLabelEl = document.getElementById('dateLabel');
const doneBannerEl = document.getElementById('doneBanner');
const errorMsgEl = document.getElementById('errorMsg');
const badErrorEl = document.getElementById('badError');

let justToggledId = null;   // 记录刚刚被点亮的习惯，用来播动画

function render() {
  const today = new Date();
  const todayStr = dateKey(today);

  dateLabelEl.textContent = `${today.getFullYear()} 年 ${today.getMonth() + 1} 月 ${today.getDate()} 日 · 星期${WEEK_LABEL[today.getDay()]}`;

  // 顶部进度
  const total = state.habits.length;
  const doneCount = state.habits.filter(h => h.done[todayStr]).length;
  barEl.style.width = total ? (doneCount / total * 100) + '%' : '0%';
  countEl.textContent = total ? `${doneCount} / ${total}` : '—';
  doneBannerEl.hidden = !(total > 0 && doneCount === total);

  emptyTipEl.hidden = total > 0;

  listEl.replaceChildren(...state.habits.map(h => habitRow(h, today)));
  badListEl.replaceChildren(...state.bad.map(b => badRow(b, todayStr)));
  badEmptyEl.hidden = state.bad.length > 0;
  justToggledId = null;   // 动画只播一次
}

// 坏习惯一行：名称 + 累计 + 今天两个计数条
function badRow(item, todayStr) {
  const rec = item.log[todayStr] || { hit: 0, held: 0 };
  const sum = totals(item);

  const li = document.createElement('li');
  li.className = 'habit';

  const top = document.createElement('div');
  top.className = 'habit-top';

  const info = document.createElement('div');
  info.className = 'info';
  const nameEl = document.createElement('div');
  nameEl.className = 'name';
  nameEl.textContent = item.name;
  const metaEl = document.createElement('div');
  metaEl.className = 'meta';
  metaEl.textContent = (sum.hit || sum.held)
    ? `累计 ${sum.hit} 次发生 · ${sum.held} 次控制住`
    : '今天还没有记录';
  info.append(nameEl, metaEl);

  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'del';
  del.textContent = '×';
  del.setAttribute('aria-label', `删除：${item.name}`);
  del.addEventListener('click', () => deleteBad(item.id));

  top.append(info, del);

  const counters = document.createElement('div');
  counters.className = 'counters';
  counters.append(
    counter(item, 'hit', '发生了', rec.hit || 0),
    counter(item, 'held', '控制住了', rec.held || 0)
  );

  li.append(top, counters);
  return li;
}

// 一个计数条：− 数字 标签。点数字 +1，点 − 减 1
function counter(item, field, label, value) {
  const wrap = document.createElement('div');
  wrap.className = 'counter ' + field;
  wrap.dataset.on = String(value > 0);

  const minus = document.createElement('button');
  minus.type = 'button';
  minus.className = 'step';
  minus.textContent = '−';
  minus.setAttribute('aria-label', `${label} 减 1`);
  minus.style.visibility = value ? 'visible' : 'hidden';   // 为 0 时留位不显示，布局不跳
  minus.addEventListener('click', () => bump(item.id, field, -1));

  const num = document.createElement('button');
  num.type = 'button';
  num.className = 'num';
  num.textContent = String(value);
  num.setAttribute('aria-label', `${item.name} ${label} 加 1，当前 ${value}`);
  num.addEventListener('click', () => bump(item.id, field, 1));

  const lab = document.createElement('span');
  lab.className = 'clabel';
  lab.textContent = label;

  wrap.append(minus, num, lab);
  return wrap;
}

// 累计次数：把每天的记录加起来
function totals(item) {
  const sum = { hit: 0, held: 0 };
  Object.values(item.log).forEach(r => {
    sum.hit += r.hit || 0;
    sum.held += r.held || 0;
  });
  return sum;
}

function habitRow(habit, today) {
  const todayStr = dateKey(today);
  const isDone = !!habit.done[todayStr];
  const streak = streakOf(habit, today);

  const li = document.createElement('li');
  li.className = 'habit';
  li.dataset.done = isDone ? 'true' : 'false';

  // --- 第一行：圆点开关 + 名称 + 连续天数 + 删除 ---
  const top = document.createElement('div');
  top.className = 'habit-top';

  const circle = document.createElement('button');
  circle.type = 'button';
  circle.className = 'circle' + (habit.id === justToggledId ? ' pop' : '');
  circle.setAttribute('aria-pressed', String(isDone));
  circle.setAttribute('aria-label', `今天${isDone ? '取消' : '完成'}：${habit.name}`);
  circle.addEventListener('click', () => toggleHabit(habit.id));

  const info = document.createElement('div');
  info.className = 'info';
  const nameEl = document.createElement('div');
  nameEl.className = 'name';
  nameEl.textContent = habit.name;
  const metaEl = document.createElement('div');
  metaEl.className = 'meta';
  metaEl.textContent = streak > 0 ? `连续 ${streak} 天` : '今天开始';
  info.append(nameEl, metaEl);

  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'del';
  del.textContent = '×';
  del.setAttribute('aria-label', `删除：${habit.name}`);
  del.addEventListener('click', () => deleteHabit(habit.id));

  top.append(circle, info, del);

  // --- 第二行：最近 7 天 ---
  const week = document.createElement('div');
  week.className = 'week';
  for (let i = 6; i >= 0; i--) {
    const d = addDays(today, -i);
    const cell = document.createElement('div');
    cell.className = 'day';
    cell.dataset.on = String(!!habit.done[dateKey(d)]);
    cell.dataset.today = String(i === 0);

    const label = document.createElement('span');
    label.textContent = WEEK_LABEL[d.getDay()];
    const dot = document.createElement('div');
    dot.className = 'dot';
    cell.append(label, dot);

    cell.title = `${dateKey(d)} ${habit.done[dateKey(d)] ? '已完成' : '未完成'}`;
    week.append(cell);
  }

  li.append(top, week);
  return li;
}

/* =====================================================================
   4) 行为层：用户操作 -> 改数据 -> 存盘 -> 重画
   ===================================================================== */
function toggleHabit(id) {
  const habit = state.habits.find(h => h.id === id);
  if (!habit) return;

  const todayStr = dateKey(new Date());
  const wasDone = !!habit.done[todayStr];
  const wasAllDone = allDoneToday();

  if (wasDone) delete habit.done[todayStr];
  else {
    habit.done[todayStr] = true;
    justToggledId = id;
  }
  save();
  render();

  if (!wasDone) {
    playPlusOne(id);
    if (!wasAllDone && allDoneToday()) sparkle();
  }
}

function allDoneToday() {
  const todayStr = dateKey(new Date());
  return state.habits.length > 0 && state.habits.every(h => h.done[todayStr]);
}

function bump(id, field, delta) {
  const item = state.bad.find(b => b.id === id);
  if (!item) return;
  const key = dateKey(new Date());
  const rec = item.log[key] || (item.log[key] = { hit: 0, held: 0 });
  rec[field] = Math.max(0, (rec[field] || 0) + delta);
  if (!rec.hit && !rec.held) delete item.log[key];   // 全是 0 就不留空记录
  save();
  render();
}

function addHabit(rawName) {
  const name = rawName.trim().replace(/\s+/g, ' ');
  if (!name) return showError(errorMsgEl, '请先输入习惯名称');
  if (state.habits.some(h => h.name === name)) return showError(errorMsgEl, '这个习惯已经在列表里了');

  state.habits.push({ id: newId(), name, done: {} });
  save();
  showError(errorMsgEl, '');
  render();
}

function addBad(rawName) {
  const name = rawName.trim().replace(/\s+/g, ' ');
  if (!name) return showError(badErrorEl, '请先输入要改掉的习惯');
  if (state.bad.some(b => b.name === name)) return showError(badErrorEl, '这个已经在列表里了');

  state.bad.push({ id: newId(), name, log: {} });
  save();
  showError(badErrorEl, '');
  render();
}

function deleteHabit(id) {
  const habit = state.habits.find(h => h.id === id);
  if (!habit) return;
  if (!confirm(`删除「${habit.name}」？打卡记录也会一起删除。`)) return;
  state.habits = state.habits.filter(h => h.id !== id);
  save();
  render();
}

function deleteBad(id) {
  const item = state.bad.find(b => b.id === id);
  if (!item) return;
  if (!confirm(`删除「${item.name}」？次数记录也会一起删除。`)) return;
  state.bad = state.bad.filter(b => b.id !== id);
  save();
  render();
}

/* =====================================================================
   5) 反馈：进度条、+1 飘字、全部完成时的小庆祝
   ===================================================================== */
function showError(el, msg) {
  el.textContent = msg;
}

function playPlusOne(id) {
  const row = [...document.querySelectorAll('.habit')][state.habits.findIndex(h => h.id === id)];
  if (!row) return;
  const tag = document.createElement('span');
  tag.className = 'plusone';
  tag.textContent = '+1';
  row.style.position = 'relative';
  tag.style.left = '34px';
  tag.style.top = '10px';
  row.append(tag);
  setTimeout(() => tag.remove(), 700);
}

function sparkle() {
  const rect = doneBannerEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.left = cx + 'px';
    s.style.top = cy + 'px';
    s.style.setProperty('--dx', (Math.random() * 160 - 80).toFixed(0) + 'px');
    s.style.setProperty('--dy', (Math.random() * -90 - 20).toFixed(0) + 'px');
    document.body.append(s);
    setTimeout(() => s.remove(), 800);
  }
}

/* =====================================================================
   6) 启动：绑定表单、跨天自动刷新
   ===================================================================== */
const form = document.getElementById('addForm');
const nameInput = document.getElementById('nameInput');
const badForm = document.getElementById('badForm');
const badInput = document.getElementById('badInput');

form.addEventListener('submit', (e) => {
  e.preventDefault();
  addHabit(nameInput.value);
  nameInput.value = '';
  nameInput.focus();
});

badForm.addEventListener('submit', (e) => {
  e.preventDefault();
  addBad(badInput.value);
  badInput.value = '';
  badInput.focus();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!state.habits.length) return;
  if (!confirm('清空所有习惯和打卡记录？此操作无法撤销。')) return;
  state = { habits: [], bad: [] };
  save();
  render();
});

// 页面一直开着跨过零点时，自动重画成新的一天
let lastDay = dateKey(new Date());
setInterval(() => {
  const now = dateKey(new Date());
  if (now !== lastDay) {
    lastDay = now;
    render();
  }
}, 30 * 1000);

render();
</script>
